name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the support contract commits to weekly updates and a
  # dependency or a WordPress release can break things while nobody is here.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job with sequential steps rather than several parallel ones: each job
  # costs a runner and a cold start, and queuing many at once on a free account
  # means some never get scheduled.
  checks:
    name: Syntax and tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # First: a parse error makes everything below meaningless.
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      # No dependencies, so this also runs on a server after an update when CI
      # is not available.
      - name: Run the test suite
        run: php tests/run.php
